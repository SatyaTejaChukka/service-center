<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pushpa Raj Automotive - Launching</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Outer Window Container */
    .splash-card {
      width: 530px;
      height: 330px;
      background: linear-gradient(145deg, #0b1120 0%, #151f32 55%, #0f172a 100%);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 22px;
      box-shadow: 0 30px 75px -10px rgba(0, 0, 0, 0.9),
                  0 0 35px rgba(245, 158, 11, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 26px 28px 22px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* Ambient Workshop Glow */
    .ambient-glow-top {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }
    .ambient-glow-bottom {
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Header: Brand Identity */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon-box {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 60%, #92400e 100%);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35),
                  inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    .brand-icon-box svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-titles h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .brand-titles p {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.4px;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Telemetry Gauge Display */
    .telemetry-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .telemetry-percent {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 26px;
      font-weight: 800;
      color: #fbbf24;
      line-height: 1;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.35);
    }
    .telemetry-unit {
      font-size: 9px;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Workshop Service Bay Inspection Lane */
    .bay-arena {
      position: relative;
      width: 100%;
      height: 106px;
      background: linear-gradient(180deg, #0e1524 0%, #162033 50%, #0e1524 100%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 3px 14px rgba(0,0,0,0.7),
                  0 8px 24px rgba(0,0,0,0.35);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    /* Workshop Safety Floor Border Guidelines */
    .bay-border-top, .bay-border-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        #f59e0b 0px,
        #f59e0b 16px,
        #1e293b 16px,
        #1e293b 32px
      );
      animation: floorLineScroll 0.6s linear infinite;
      z-index: 1;
    }
    .bay-border-top { top: 0; }
    .bay-border-bottom { bottom: 0; }

    @keyframes floorLineScroll {
      0% { background-position: 0 0; }
      100% { background-position: -32px 0; }
    }

    /* Epoxy Floor Center Bay Alignment Guide */
    .bay-center-guide {
      position: absolute;
      top: 52%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.35) 0px,
        rgba(255, 255, 255, 0.35) 20px,
        transparent 20px,
        transparent 40px
      );
      animation: guideScroll 0.5s linear infinite;
    }

    @keyframes guideScroll {
      0% { background-position: 0 0; }
      100% { background-position: -40px 0; }
    }

    /* Workshop Intake Gate Marker (Left) */
    .intake-gate {
      position: absolute;
      left: 14px;
      top: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .gate-pillar {
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }
    .gate-label {
      position: absolute;
      top: 2px;
      left: 8px;
      font-size: 8px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Workshop Service Bay Hub (Right Destination) */
    .service-bay-hub {
      position: absolute;
      right: 12px;
      top: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
    }
    .bay-icon-svg {
      width: 22px;
      height: 22px;
      stroke: #10b981;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6));
    }
    .bay-status-text {
      font-size: 8.5px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 3px;
      white-space: nowrap;
    }

    /* The Driving Passenger SUV/Crossover */
    .car-chassis-container {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 82px;
      height: 44px;
      z-index: 5;
      transition: left 0.1s linear;
      pointer-events: none;
    }

    .car-vibration-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      animation: carSuspension 0.15s ease-in-out infinite alternate;
    }

    @keyframes carSuspension {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-1px); }
    }

    /* Realistic Soft Floor Shadow under Car */
    .car-floor-shadow {
      position: absolute;
      bottom: 1px;
      left: 4px;
      width: 74px;
      height: 6px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.85) 0%, transparent 80%);
      filter: blur(1.5px);
      z-index: 1;
    }

    /* Headlight Beam Illuminating Service Bay Floor */
    .headlight-cone {
      position: absolute;
      top: 18px;
      right: -75px;
      width: 80px;
      height: 18px;
      background: linear-gradient(90deg, rgba(254, 240, 138, 0.55) 0%, rgba(254, 240, 138, 0.18) 50%, transparent 100%);
      clip-path: polygon(0 35%, 100% 0, 100% 100%, 0 65%);
      pointer-events: none;
      filter: blur(1px);
      z-index: 2;
    }

    /* Rotating Alloy Wheels */
    .wheel {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #0f172a;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      bottom: 2px;
      z-index: 6;
      box-shadow: 0 2px 5px rgba(0,0,0,0.9);
      animation: wheelSpin 0.3s linear infinite;
    }
    .wheel-disc {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 2px;
      background: #f59e0b;
      transform: translate(-50%, -50%);
    }
    .wheel-disc::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 9px;
      height: 2px;
      background: #f59e0b;
      transform: rotate(90deg);
    }
    .wheel-front { right: 11px; }
    .wheel-rear { left: 13px; }

    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Bay Inspection Diagnostic Scan Beam Pulse */
    .diagnostic-scan-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.2), transparent);
      animation: diagScan 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes diagScan {
      0% { left: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { left: 100%; opacity: 0; }
    }

    /* Progress Glow on Floor */
    .bay-progress-glow {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.05) 0%, rgba(245, 158, 11, 0.16) 100%);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    /* Footer: Live Telemetry & Status HUD */
    .footer {
      position: relative;
      z-index: 2;
    }
    .status-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-msg-box {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .status-radar-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: radarPulse 1.4s infinite ease-out;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; box-shadow: 0 0 14px #10b981; }
      100% { transform: scale(0.9); opacity: 1; }
    }
    .status-msg-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .bay-stage-tag {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* Bottom Sub-Progress Track */
    .mini-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .mini-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24);
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom"></div>

    <!-- Header: Business Brand & Telemetry -->
    <div class="header">
      <div class="brand-group">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 10.7 2 10.8 2 11v5c0 .6.4 1 1 1h2"></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
        </div>
        <div class="brand-titles">
          <h1>Pushpa Raj Automotive</h1>
          <p>
            Service Center Management 
            <span class="brand-badge">Desktop Bay Suite</span>
          </p>
        </div>
      </div>

      <div class="telemetry-badge">
        <div class="telemetry-percent"><span id="speed-val">0</span>%</div>
        <div class="telemetry-unit">Bay Initialization</div>
      </div>
    </div>

    <!-- Workshop Service Bay Floor & Customer Vehicle Journey -->
    <div class="bay-arena" id="bay-arena">
      <div class="bay-border-top"></div>
      <div class="bay-border-bottom"></div>
      <div class="bay-center-guide"></div>

      <!-- Workshop Intake Gate (Start) -->
      <div class="intake-gate">
        <span class="gate-label">INSPECTION INTAKE</span>
        <div class="gate-pillar"></div>
      </div>

      <!-- Live progress floor illumination & diagnostic scan -->
      <div class="bay-progress-glow" id="bay-glow"></div>
      <div class="diagnostic-scan-overlay"></div>

      <!-- The Driving Passenger SUV/Crossover (Creta / Urban Crossover Profile) -->
      <div class="car-chassis-container" id="car-sprite">
        <div class="car-floor-shadow"></div>
        <div class="headlight-cone"></div>

        <div class="car-vibration-wrapper">
          <!-- Authentic Passenger SUV / Crossover Silhouette SVG -->
          <svg viewBox="0 0 82 36" width="82" height="36" style="position: relative; z-index: 4;">
            <defs>
              <linearGradient id="suvBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ea580c" />
                <stop offset="50%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#c2410c" />
              </linearGradient>
              <linearGradient id="suvGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
              </linearGradient>
            </defs>

            <!-- Roof Rails (SUV Utility Detail) -->
            <path d="M 23 8 L 52 8" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
            <line x1="26" y1="8" x2="26" y2="10" stroke="#94a3b8" stroke-width="1.5" />
            <line x1="49" y1="8" x2="49" y2="10" stroke="#94a3b8" stroke-width="1.5" />

            <!-- SUV Main Body Shell (Creta / Urban Crossover Shape) -->
            <path d="M 8 20 
                     L 10 13 
                     L 22 9 
                     L 54 9 
                     L 68 15 
                     L 78 18 
                     C 80 19 80 23 77 25 
                     L 74 25 
                     L 8 25 
                     C 6 25 6 21 8 20 Z" 
                  fill="url(#suvBodyGrad)" 
                  stroke="#fdba74" 
                  stroke-width="0.8" />

            <!-- Window Greenhouse & Pillar Dividers -->
            <path d="M 23 11 
                     L 52 11 
                     L 64 16 
                     L 20 16 Z" 
                  fill="url(#suvGlassGrad)" 
                  stroke="#38bdf8" 
                  stroke-width="0.5" />
            <!-- B-Pillar divider -->
            <line x1="38" y1="11" x2="38" y2="16" stroke="#0f172a" stroke-width="1.8" />

            <!-- Body Character Crease Line -->
            <path d="M 12 18 L 76 20" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-linecap="round" />

            <!-- Modern Passenger Headlight DRL -->
            <polygon points="75,18 79,19 76,21 73,20" fill="#fef08a" filter="drop-shadow(0 0 3px #fef08a)" />

            <!-- Red Taillight -->
            <polygon points="7,18 10,18 10,21 7,21" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)" />

            <!-- Front Grille & Fog Lamp accent -->
            <rect x="76" y="22" width="2" height="2" fill="#e2e8f0" />
          </svg>

          <!-- Rotating Front & Rear Wheels -->
          <div class="wheel wheel-rear">
            <div class="wheel-disc"></div>
          </div>
          <div class="wheel wheel-front">
            <div class="wheel-disc"></div>
          </div>
        </div>
      </div>

      <!-- Workshop Service Bay Hub Destination (Right) -->
      <div class="service-bay-hub">
        <svg class="bay-icon-svg" viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="bay-status-text">DELIVERY READY</div>
      </div>
    </div>

    <!-- Footer: Live Telemetry & Status HUD -->
    <div class="footer">
      <div class="status-hud">
        <div class="status-msg-box">
          <div class="status-radar-dot"></div>
          <div class="status-msg-text" id="status-label">Vehicle Check-in & Intake Inspection...</div>
        </div>
        <div class="bay-stage-tag" id="bay-tag">VEHICLE INTAKE</div>
      </div>

      <div class="mini-progress-track">
        <div class="mini-progress-fill" id="mini-progress"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var currentVal = 0;
      var targetVal = 10;
      var car = document.getElementById('car-sprite');
      var bayGlow = document.getElementById('bay-glow');
      var miniProgress = document.getElementById('mini-progress');
      var speedVal = document.getElementById('speed-val');
      var statusLabel = document.getElementById('status-label');
      var bayTag = document.getElementById('bay-tag');
      var arena = document.getElementById('bay-arena');

      // Genuine Automotive Workshop Business Milestones
      var milestones = [
        { at: 0, text: 'Vehicle Check-in & Intake Inspection...', tag: 'VEHICLE INTAKE' },
        { at: 20, text: 'Running Diagnostics & Multi-Point Inspection...', tag: 'DIAGNOSTICS' },
        { at: 40, text: 'Retrieving Vehicle Service History & Customer Profile...', tag: 'SERVICE HISTORY' },
        { at: 65, text: 'Syncing Spare Parts, Fluids & Labour Operations...', tag: 'PARTS & LABOUR' },
        { at: 85, text: 'Final Quality Inspection, Washing & Bay Check...', tag: 'QUALITY CHECK' },
        { at: 100, text: 'Service Complete • Vehicle Ready for Delivery', tag: 'READY FOR DELIVERY' }
      ];

      function updateStatusByPercent(p) {
        for (var i = milestones.length - 1; i >= 0; i--) {
          if (p >= milestones[i].at) {
            statusLabel.innerText = milestones[i].text;
            bayTag.innerText = milestones[i].tag;
            break;
          }
        }
      }

      // Smooth simulation advancement while sidecar spins up
      var autoTimer = setInterval(function() {
        if (targetVal < 92) {
          targetVal += (92 - targetVal) * 0.08 + 0.35;
        }
      }, 70);

      // Smooth 60 FPS interpolation loop
      function renderLoop() {
        if (currentVal < targetVal) {
          currentVal += (targetVal - currentVal) * 0.12 + 0.08;
          if (currentVal > targetVal) currentVal = targetVal;
        }

        var clamped = Math.min(Math.max(currentVal, 0), 100);
        var intVal = Math.floor(clamped);

        speedVal.innerText = intVal;
        miniProgress.style.width = clamped + '%';
        bayGlow.style.width = clamped + '%';

        // Calculate car position along the workshop service bay lane
        var arenaWidth = arena.offsetWidth || 474;
        var carWidth = 82;
        var paddingRight = 95; // Leave Service Bay Hub clearly visible at destination
        var availableTravel = arenaWidth - carWidth - paddingRight - 14;
        var travelX = 14 + (clamped / 100) * availableTravel;

        car.style.left = travelX + 'px';
        updateStatusByPercent(clamped);

        requestAnimationFrame(renderLoop);
      }

      requestAnimationFrame(renderLoop);

      // Listen for main process messages
      if (window.electronAPI && window.electronAPI.onSplashStatus) {
        window.electronAPI.onSplashStatus(function(data) {
          if (typeof data === 'string') {
            statusLabel.innerText = data;
          } else if (data && typeof data === 'object') {
            if (data.message) statusLabel.innerText = data.message;
            if (typeof data.percent === 'number') {
              targetVal = data.percent;
            }
          }
        });
      }
    })();
  </script>
</body>
</html>
