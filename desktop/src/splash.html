<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pushpa Raj Automotive Services - Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-card {
      width: 480px;
      height: 310px;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .ambient-glow {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
    }
    .brand-icon svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }
    .center-visual {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .version-tag {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
      font-family: monospace;
    }
    .footer {
      width: 100%;
    }
    .status-text {
      font-size: 12.5px;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #d97706, #fbbf24);
      border-radius: 6px;
      animation: indeterminate 2s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 35%; }
      50% { transform: translateX(100%); width: 65%; }
      100% { transform: translateX(300%); width: 35%; }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="ambient-glow"></div>
    
    <div class="header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 10.7 2 10.8 2 11v5c0 .6.4 1 1 1h2"></path>
          <circle cx="7" cy="17" r="2"></circle>
          <path d="M9 17h6"></path>
          <circle cx="17" cy="17" r="2"></circle>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Pushpa Raj Automotive</h1>
        <p>Offline Workshop Management Suite</p>
      </div>
    </div>

    <div class="center-visual">
      <div class="badge-pill">
        <span class="badge-dot"></span>
        <span>Secure Local SQLite WAL Engine</span>
      </div>
      <span class="version-tag">v1.0.0 &bull; Desktop</span>
    </div>

    <div class="footer">
      <div class="status-text">
        <span id="status-label">Initializing application services...</span>
        <span style="color: #94a3b8; font-size: 11px;">100% Offline</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Listen for status messages from main process if available
    if (window.electronAPI && window.electronAPI.onSplashStatus) {
      window.electronAPI.onSplashStatus(function(msg) {
        var el = document.getElementById('status-label');
        if (el) el.innerText = msg;
      });
    }
  </script>
</body>
</html>
